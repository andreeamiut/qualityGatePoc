name: 🔒 Security & Maintenance

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'requirements.txt'
      - 'app/requirements.txt'
      - 'app/Dockerfile'
      - '.github/workflows/security-maintenance.yml'

# Dependency updates are handled by Dependabot (.github/dependabot.yml).

jobs:
  # ==========================================
  # Security Vulnerability Scanning
  # ==========================================
  security-scan:
    name: 🛡️ Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v7

    - name: 🐍 Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: 📦 Install Security Tools
      run: |
        pip install safety bandit semgrep
        if [ -f "app/requirements.txt" ]; then
          pip install -r app/requirements.txt
        fi

    - name: 🔍 Python Dependency Vulnerability Scan
      run: |
        safety check --output json > safety_report.json || true
        safety check || true

    - name: 🛡️ Static Security Analysis (Bandit)
      run: |
        bandit -r app/ -f json -o bandit_security_report.json || true
        bandit -r app/ -ll || true

    - name: 🔒 Security Patterns (Semgrep)
      run: |
        semgrep --config=auto app/ --json --output=semgrep_report.json || true
        semgrep --config=auto app/ || true

    - name: 🐳 Container Security Scan (Trivy)
      run: |
        docker build -t security-scan-image ./app
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        trivy image --format json --output container_security_report.json security-scan-image || true
        trivy image --severity HIGH,CRITICAL security-scan-image

    - name: 📊 Security Summary
      run: |
        {
          echo "## 🛡️ Security scan"
          echo ""
          echo "- Date: $(date -u)"
          echo "- Branch: ${{ github.ref_name }}"
          echo "- Bandit findings: $(jq '.results | length' bandit_security_report.json 2>/dev/null || echo n/a)"
          echo "- Semgrep findings: $(jq '.results | length' semgrep_report.json 2>/dev/null || echo n/a)"
          echo "- Trivy HIGH/CRITICAL: $(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity==\"HIGH\" or .Severity==\"CRITICAL\")] | length' container_security_report.json 2>/dev/null || echo n/a)"
          echo ""
          echo "Full reports are attached as the \`security-reports\` artifact."
        } | tee security_summary.md >> "$GITHUB_STEP_SUMMARY"

    - name: 📤 Upload Security Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          safety_report.json
          bandit_security_report.json
          semgrep_report.json
          container_security_report.json
          security_summary.md

  # ==========================================
  # Health Check & End-to-End Smoke Test
  # ==========================================
  health-monitoring:
    name: 🩺 System Health Monitoring
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v7

    - name: 🚀 Start Services
      run: |
        docker compose up -d app postgres-db redis
        echo "⏳ Waiting for the API and seeded database..."
        for i in $(seq 1 60); do
          if curl -fs http://localhost:5000/api/v1/stats > /dev/null; then
            echo "✅ API is up after $((i * 2))s"
            exit 0
          fi
          sleep 2
        done
        echo "❌ API did not become healthy within 120s"
        docker compose logs app postgres-db
        exit 1

    - name: 🩺 Endpoint Health Checks
      run: |
        HEALTH_CHECKS=(
          "http://localhost:5000/health|API Health"
          "http://localhost:5000/api/v1/stats|Statistics Endpoint"
        )

        FAILED_CHECKS=0
        for check in "${HEALTH_CHECKS[@]}"; do
          URL="${check%%|*}"
          NAME="${check#*|}"
          if curl -fs "$URL" > /dev/null; then
            echo "  ✅ $NAME: HEALTHY"
          else
            echo "  ❌ $NAME: FAILED ($URL)"
            FAILED_CHECKS=$((FAILED_CHECKS + 1))
          fi
        done

        echo "Passed: $((${#HEALTH_CHECKS[@]} - FAILED_CHECKS))/${#HEALTH_CHECKS[@]}"
        [ "$FAILED_CHECKS" -eq 0 ]

    - name: 🔄 End-to-End Transaction Test
      run: |
        TXN_RESPONSE=$(curl -s -X POST -H "Content-Type: application/json" \
          -d '{"customer_id": "CUST_00000001", "amount": 25.00, "transaction_type": "credit"}' \
          http://localhost:5000/api/v1/transaction)
        echo "Response: $TXN_RESPONSE"

        if echo "$TXN_RESPONSE" | grep -q '"SUCCESS"'; then
          echo "✅ Transaction workflow: PASSED"
        else
          echo "❌ Transaction workflow: FAILED"
          exit 1
        fi

        if curl -s http://localhost:5000/api/v1/stats | grep -q "total_transactions"; then
          echo "✅ Data persistence: VERIFIED"
        else
          echo "❌ Data persistence: FAILED"
          exit 1
        fi

    - name: 🧹 Cleanup
      if: always()
      run: docker compose down -v
